<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Shop</title>
    <style>
      :root { --bg: #f6f7fb; --card: #fff; --ink: #1f2430; --muted: #687385; --line: #e3e6ee; --brand: #4f46e5; --bad: #c62828; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14161c; --card: #1d2029; --ink: #e8eaf0; --muted: #9aa3b5; --line: #2d313d; --brand: #8b85ff; --bad: #ff8a80; } }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
      header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
      main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      input[type=email], input[type=password], input[type=search], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: var(--card); color: var(--ink); }
      button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 8px; }
      .filters { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
      .error { color: var(--bad); margin-top: 8px; min-height: 1.5em; }
      dialog { border: none; border-radius: 12px; padding: 24px; max-width: 380px; }
      dialog::backdrop { background: rgba(0,0,0,.4); }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <header><strong>🛒 Demo Shop</strong><span id="who" class="muted"></span></header>
    <main id="app"></main>

    <dialog id="confirm" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Order confirmed</h2>
      <p>Your order <b id="orderId"></b> has been placed.</p>
      <button class="primary" id="viewOrder">View order</button>
      <button id="closeDialog">Close</button>
    </dialog>

    <script>
      const app = document.getElementById('app');
      let token = sessionStorage.getItem('token');
      let cart = [];

      async function api(method, path, body) {
        const res = await fetch(path, {
          method,
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json();
        if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status });
        return data;
      }
      function go(path) { history.pushState({}, '', path); render(); }
      window.addEventListener('popstate', render);

      function render() {
        const p = location.pathname;
        if (!token) return loginPage();
        const m = p.match(/^\/app\/orders\/(\d+)/);
        if (m) return orderPage(m[1]);
        return productsPage();
      }

      function loginPage() {
        if (location.pathname !== '/app/login') history.replaceState({}, '', '/app/login');
        app.innerHTML = `
          <form class="card" id="loginForm" aria-label="Sign in">
            <h1>Sign in</h1>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <div class="error" role="alert" id="loginError"></div>
            <button class="primary" type="submit">Sign in</button>
          </form>`;
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const r = await api('POST', '/api/login', { email: email.value, password: password.value });
            token = r.token;
            sessionStorage.setItem('token', token);
            document.getElementById('who').textContent = r.user.name;
            go('/app/products');
          } catch (err) {
            document.getElementById('loginError').textContent = err.message;
          }
        });
      }

      async function productsPage() {
        app.innerHTML = `
          <section class="card">
            <h1>Products</h1>
            <div class="filters">
              <input type="search" id="q" placeholder="Search products" aria-label="Search products" />
              <select id="category" aria-label="Category">
                <option value="">All categories</option>
                <option value="peripherals">Peripherals</option>
                <option value="displays">Displays</option>
                <option value="audio">Audio</option>
              </select>
            </div>
            <div id="list" data-testid="product-list"></div>
          </section>
          <section class="card" aria-label="Cart">
            <h2>Cart (<span id="cartCount">0</span>)</h2>
            <div id="cartItems" class="muted">Empty</div>
            <label><input type="checkbox" id="express" /> Express delivery</label>
            <div class="row"><button id="coupon">Apply coupon</button><button class="primary" data-testid="place-order">Place order</button></div>
            <div class="error" role="alert" id="orderError"></div>
          </section>`;
        const load = async () => {
          const params = new URLSearchParams({ q: q.value, category: category.value });
          const { items } = await api('GET', `/api/products?${params}`);
          list.innerHTML = items.map((x) => `<div class="row"><span>${x.name} — $${x.price.toFixed(2)}</span><button data-testid="add-${x.id}" data-id="${x.id}">Add to cart</button></div>`).join('') || '<p class="muted">No products</p>';
        };
        let t;
        q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(load, 300); });
        category.addEventListener('change', load);
        list.addEventListener('click', (e) => {
          const id = Number(e.target.dataset.id);
          if (!id) return;
          const line = cart.find((c) => c.id === id);
          line ? line.qty++ : cart.push({ id, qty: 1 });
          cartCount.textContent = cart.reduce((s, c) => s + c.qty, 0);
          cartItems.textContent = cart.map((c) => `#${c.id} × ${c.qty}`).join(', ');
        });
        coupon.addEventListener('click', async () => {
          try { await api('POST', '/api/coupon', { code: 'WELCOME10' }); }
          catch (err) { console.error('Coupon failed', err); orderError.textContent = err.message; }
        });
        document.querySelector('[data-testid="place-order"]').addEventListener('click', async () => {
          try {
            const order = await api('POST', '/api/orders', { items: cart, express: express.checked });
            document.getElementById('orderId').textContent = `#${order.id}`;
            const dlg = document.getElementById('confirm');
            dlg.dataset.order = order.id;
            dlg.showModal();
            cart = [];
          } catch (err) { orderError.textContent = err.message; }
        });
        await load();
      }

      async function orderPage(id) {
        app.innerHTML = `<section class="card"><h1>Order #${id}</h1><div id="detail" class="muted">Loading…</div><button id="back">Back to products</button></section>`;
        back.addEventListener('click', () => go('/app/products'));
        try {
          const o = await api('GET', `/api/orders/${id}`);
          detail.innerHTML = `<p>Status: <b data-testid="order-status">${o.status}</b></p><p>Total: <b data-testid="order-total">$${o.total.toFixed(2)}</b></p><p>${o.express ? 'Express' : 'Standard'} delivery</p>`;
        } catch (err) { detail.textContent = err.message; }
      }

      document.getElementById('viewOrder').addEventListener('click', () => {
        const dlg = document.getElementById('confirm');
        dlg.close();
        go(`/app/orders/${dlg.dataset.order}`);
      });
      document.getElementById('closeDialog').addEventListener('click', () => document.getElementById('confirm').close());
      render();
    </script>
  </body>
</html>
